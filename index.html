<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding: 15px;
        }
        
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }
        
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { color: #888; font-size: 13px; }
        
        .card {
            background: #151520;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid #252535;
        }
        
        .card h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #4cc9f0;
        }
        
        .temps {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .temp-box {
            background: #0a0a0f;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .temp-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .temp-value {
            font-size: 28px;
            font-weight: bold;
            font-family: monospace;
        }
        
        .temp-value.ok { color: #22c55e; }
        .temp-value.bad { color: #ef4444; }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #252535;
            font-size: 13px;
        }
        
        .status-row:last-child { border-bottom: none; }
        .status-row .label { color: #888; }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4361ee, #4cc9f0);
            color: white;
        }
        
        .btn-secondary {
            background: #252535;
            color: white;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .notif-status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        
        .notif-status.granted {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }
        
        .notif-status.denied {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        
        .notif-status.default {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        
        .log {
            background: #0a0a0f;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 10px;
            color: #888;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        th, td {
            padding: 10px 6px;
            text-align: left;
            border-bottom: 1px solid #252535;
        }
        
        th {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .badge.ok { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .badge.bad { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🌡️ Pharmacy Monitor</h1>
    <p><span class="live-dot"></span>Live Temperature Monitoring</p>
</div>

<!-- Notifications Card -->
<div class="card">
    <h2>🔔 Notifications</h2>
    
    <div class="notif-status default" id="notifStatus">
        Checking notification support...
    </div>
    
    <button class="btn btn-primary" id="enableBtn" onclick="enableNotifications()">
        Enable Notifications
    </button>
    
    <button class="btn btn-secondary" id="testBtn" onclick="testNotification()">
        🧪 Test Notification
    </button>
    
    <div class="log" id="log">Initializing...</div>
</div>

<!-- Temperature Card -->
<div class="card">
    <h2>📊 Current Readings</h2>
    
    <div class="temps">
        <div class="temp-box">
            <div class="temp-label">🏠 AMBIENT</div>
            <div class="temp-value ok" id="ambientTemp">--.-°C</div>
        </div>
        <div class="temp-box">
            <div class="temp-label">🧊 FRIDGE</div>
            <div class="temp-value ok" id="fridgeTemp">--.-°C</div>
        </div>
    </div>
</div>

<!-- Status Card -->
<div class="card">
    <h2>ℹ️ Status</h2>
    
    <div class="status-row">
        <span class="label">Last Update</span>
        <span id="lastUpdate">--:--</span>
    </div>
    <div class="status-row">
        <span class="label">Connection</span>
        <span id="connection">Connecting...</span>
    </div>
    <div class="status-row">
        <span class="label">Alerts Today</span>
        <span id="alertCount">0</span>
    </div>
</div>

<!-- History Card -->
<div class="card">
    <h2>📋 Recent History</h2>
    
    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Ambient</th>
                <th>Fridge</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="historyTable">
            <tr><td colspan="4" style="text-align:center;color:#666;">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
// ============================================
// CONFIGURATION
// ============================================
var SUPABASE_URL = 'https://avxakvxjgpwzctuagaww.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2eGFrdnhqZ3B3emN0dWFnYXd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5OTI3OTAsImV4cCI6MjA4MzU2ODc5MH0.G6lrbb0KJ2vkW0ZSJvwY6FemajmpRpRurK0Qd6H6YXo';

var AMBIENT_MIN = 15;
var AMBIENT_MAX = 25;
var FRIDGE_MIN = 2;
var FRIDGE_MAX = 8;

// ============================================
// LOGGING
// ============================================
function log(message) {
    console.log('[App] ' + message);
    var logEl = document.getElementById('log');
    var time = new Date().toLocaleTimeString();
    logEl.innerHTML = '[' + time + '] ' + message + '\n' + logEl.innerHTML;
    // Keep log small
    if (logEl.innerHTML.length > 3000) {
        logEl.innerHTML = logEl.innerHTML.substring(0, 3000);
    }
}

// ============================================
// NOTIFICATION FUNCTIONS
// ============================================
function checkNotificationSupport() {
    log('Checking notification support...');
    
    var statusEl = document.getElementById('notifStatus');
    var enableBtn = document.getElementById('enableBtn');
    var testBtn = document.getElementById('testBtn');
    
    // Check if Notification API exists
    if (!('Notification' in window)) {
        log('Notification API NOT available');
        statusEl.textContent = '❌ Notifications not supported on this browser';
        statusEl.className = 'notif-status denied';
        enableBtn.disabled = true;
        testBtn.disabled = true;
        return;
    }
    
    log('Notification API available');
    log('Current permission: ' + Notification.permission);
    
    // Update UI based on current permission
    updateNotificationUI();
}

function updateNotificationUI() {
    var statusEl = document.getElementById('notifStatus');
    var enableBtn = document.getElementById('enableBtn');
    var permission = Notification.permission;
    
    if (permission === 'granted') {
        statusEl.textContent = '✅ Notifications enabled! You will receive alerts.';
        statusEl.className = 'notif-status granted';
        enableBtn.textContent = '✓ Already Enabled';
        enableBtn.disabled = true;
    } else if (permission === 'denied') {
        statusEl.textContent = '❌ Notifications blocked. Please enable in browser settings.';
        statusEl.className = 'notif-status denied';
        enableBtn.textContent = 'Blocked by Browser';
        enableBtn.disabled = true;
    } else {
        statusEl.textContent = '⚠️ Click button below to enable alerts';
        statusEl.className = 'notif-status default';
        enableBtn.textContent = 'Enable Notifications';
        enableBtn.disabled = false;
    }
}

function enableNotifications() {
    log('Enable button clicked');
    
    var btn = document.getElementById('enableBtn');
    btn.textContent = 'Requesting...';
    btn.disabled = true;
    
    // Request permission
    Notification.requestPermission()
        .then(function(permission) {
            log('Permission result: ' + permission);
            updateNotificationUI();
            
            if (permission === 'granted') {
                log('Permission granted!');
                // Show a welcome notification
                showNotification('🎉 Notifications Enabled!', 'You will now receive temperature alerts.');
            }
        })
        .catch(function(error) {
            log('Permission error: ' + error);
            btn.textContent = 'Error - Try Again';
            btn.disabled = false;
        });
}

function testNotification() {
    log('Test button clicked');
    
    // Check permission first
    if (Notification.permission !== 'granted') {
        log('Permission not granted, requesting...');
        alert('Please enable notifications first by clicking the Enable button');
        return;
    }
    
    // Show test notification
    showNotification(
        '🧪 Test Alert', 
        'Notifications are working! Time: ' + new Date().toLocaleTimeString()
    );
    
    log('Test notification sent');
}

function showNotification(title, body) {
    log('Showing notification: ' + title);
    
    try {
        var notification = new Notification(title, {
            body: body,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌡️</text></svg>',
            badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔔</text></svg>',
            tag: 'pharmacy-' + Date.now(),
            requireInteraction: false
        });
        
        notification.onclick = function() {
            log('Notification clicked');
            window.focus();
            notification.close();
        };
        
        notification.onshow = function() {
            log('Notification displayed successfully');
        };
        
        notification.onerror = function(e) {
            log('Notification error: ' + e);
        };
        
        // Auto close after 5 seconds
        setTimeout(function() {
            notification.close();
        }, 5000);
        
    } catch (e) {
        log('Notification exception: ' + e.message);
        alert('Notification error: ' + e.message);
    }
}

// ============================================
// DATA FUNCTIONS
// ============================================
var supabaseClient = null;

function initSupabase() {
    log('Initializing Supabase...');
    
    // Simple fetch-based approach (no library needed)
    loadCurrentReading();
    loadHistory();
    
    // Refresh every 30 seconds
    setInterval(function() {
        loadCurrentReading();
    }, 30000);
    
    document.getElementById('connection').textContent = 'Connected';
    document.getElementById('connection').style.color = '#22c55e';
}

function loadCurrentReading() {
    var url = SUPABASE_URL + '/rest/v1/temperature_readings?order=timestamp.desc&limit=1';
    
    fetch(url, {
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
        }
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(data) {
        if (data && data.length > 0) {
            updateTemperatureDisplay(data[0]);
        }
    })
    .catch(function(error) {
        log('Error loading data: ' + error);
        document.getElementById('connection').textContent = 'Error';
        document.getElementById('connection').style.color = '#ef4444';
    });
}

function updateTemperatureDisplay(reading) {
    var ambient = parseFloat(reading.ambient_temp);
    var fridge = parseFloat(reading.freezer_temp);
    
    var ambientEl = document.getElementById('ambientTemp');
    var fridgeEl = document.getElementById('fridgeTemp');
    
    ambientEl.textContent = ambient.toFixed(1) + '°C';
    fridgeEl.textContent = fridge.toFixed(1) + '°C';
    
    // Check if in range
    var ambientOk = ambient >= AMBIENT_MIN && ambient <= AMBIENT_MAX;
    var fridgeOk = fridge >= FRIDGE_MIN && fridge <= FRIDGE_MAX;
    
    ambientEl.className = 'temp-value ' + (ambientOk ? 'ok' : 'bad');
    fridgeEl.className = 'temp-value ' + (fridgeOk ? 'ok' : 'bad');
    
    // Update timestamp
    var time = new Date(reading.timestamp);
    document.getElementById('lastUpdate').textContent = time.toLocaleTimeString();
    
    // Show alert if out of range
    if (!ambientOk || !fridgeOk) {
        if (Notification.permission === 'granted') {
            var msg = '';
            if (!ambientOk) msg += 'Ambient: ' + ambient.toFixed(1) + '°C ';
            if (!fridgeOk) msg += 'Fridge: ' + fridge.toFixed(1) + '°C';
            showNotification('🚨 Temperature Alert!', msg);
        }
    }
}

function loadHistory() {
    var url = SUPABASE_URL + '/rest/v1/temperature_readings?order=timestamp.desc&limit=10';
    
    fetch(url, {
        headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
        }
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(data) {
        var tbody = document.getElementById('historyTable');
        
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#666;">No data</td></tr>';
            return;
        }
        
        var html = '';
        var alertCount = 0;
        
        for (var i = 0; i < data.length; i++) {
            var r = data[i];
            var ambient = parseFloat(r.ambient_temp);
            var fridge = parseFloat(r.freezer_temp);
            var time = new Date(r.timestamp).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            
            var ambientOk = ambient >= AMBIENT_MIN && ambient <= AMBIENT_MAX;
            var fridgeOk = fridge >= FRIDGE_MIN && fridge <= FRIDGE_MAX;
            var rowOk = ambientOk && fridgeOk;
            
            if (!rowOk) alertCount++;
            
            html += '<tr>';
            html += '<td>' + time + '</td>';
            html += '<td style="color:' + (ambientOk ? '#4cc9f0' : '#ef4444') + '">' + ambient.toFixed(1) + '°</td>';
            html += '<td style="color:' + (fridgeOk ? '#4361ee' : '#ef4444') + '">' + fridge.toFixed(1) + '°</td>';
            html += '<td><span class="badge ' + (rowOk ? 'ok' : 'bad') + '">' + (rowOk ? '✓ OK' : '⚠️') + '</span></td>';
            html += '</tr>';
        }
        
        tbody.innerHTML = html;
        document.getElementById('alertCount').textContent = alertCount;
        document.getElementById('alertCount').style.color = alertCount > 0 ? '#ef4444' : '#22c55e';
    })
    .catch(function(error) {
        log('Error loading history: ' + error);
    });
}

// ============================================
// INITIALIZATION
// ============================================
function init() {
    log('App starting...');
    log('User Agent: ' + navigator.userAgent.substring(0, 50));
    
    // Check notifications
    checkNotificationSupport();
    
    // Load data
    initSupabase();
    
    log('App initialized');
}

// Start when page loads
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>

</body>
</html>
