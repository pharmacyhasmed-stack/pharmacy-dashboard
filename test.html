<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .test-box {
            background: #252540;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .status {
            padding: 8px 12px;
            border-radius: 5px;
            margin: 5px 0;
            font-family: monospace;
            font-size: 12px;
        }
        .pass { background: #22c55e33; border-left: 3px solid #22c55e; }
        .fail { background: #ef444433; border-left: 3px solid #ef4444; }
        .warn { background: #f59e0b33; border-left: 3px solid #f59e0b; }
        .info { background: #4361ee33; border-left: 3px solid #4361ee; }
        button {
            background: #4361ee;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; }
        h1 { font-size: 20px; }
        h2 { font-size: 16px; margin-top: 20px; }
        #log {
            background: #0a0a0f;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>🔔 Notification Diagnostic</h1>
    <p>Testing on: <strong id="device">detecting...</strong></p>
    
    <div class="test-box">
        <h2>Step 1: Browser Capabilities</h2>
        <div id="capabilities"></div>
    </div>
    
    <div class="test-box">
        <h2>Step 2: Permission Status</h2>
        <div id="permission"></div>
        <button onclick="requestPermission()">Request Permission</button>
    </div>
    
    <div class="test-box">
        <h2>Step 3: Basic Notification</h2>
        <div id="basicTest"></div>
        <button onclick="testBasicNotification()">Test Basic Notification</button>
    </div>
    
    <div class="test-box">
        <h2>Step 4: Service Worker</h2>
        <div id="swTest"></div>
        <button onclick="testServiceWorker()">Test Service Worker</button>
    </div>
    
    <div class="test-box">
        <h2>Step 5: Push Manager</h2>
        <div id="pushTest"></div>
        <button onclick="testPushManager()">Test Push Manager</button>
    </div>
    
    <h2>📋 Full Log</h2>
    <div id="log"></div>
    
    <script>
    var logEl = document.getElementById('log');
    
    function log(msg, type) {
        var time = new Date().toLocaleTimeString();
        logEl.innerHTML += '[' + time + '] ' + msg + '\n';
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
    }
    
    function addStatus(containerId, msg, type) {
        var div = document.createElement('div');
        div.className = 'status ' + type;
        div.textContent = msg;
        document.getElementById(containerId).appendChild(div);
        log(msg, type);
    }
    
    // Detect device
    function detectDevice() {
        var ua = navigator.userAgent;
        var info = [];
        
        if (/Samsung/i.test(ua)) info.push('Samsung');
        if (/Android/i.test(ua)) {
            var match = ua.match(/Android\s([\d.]+)/);
            info.push('Android ' + (match ? match[1] : ''));
        }
        if (/Chrome\/(\d+)/.test(ua)) {
            info.push('Chrome ' + RegExp.$1);
        }
        if (/SamsungBrowser\/(\d+)/.test(ua)) {
            info.push('Samsung Browser ' + RegExp.$1);
        }
        
        document.getElementById('device').textContent = info.join(' | ') || ua.substring(0, 50);
        log('Device: ' + info.join(' | '));
        log('Full UA: ' + ua);
    }
    
    // Step 1: Check capabilities
    function checkCapabilities() {
        var c = document.getElementById('capabilities');
        
        // Notification API
        if ('Notification' in window) {
            addStatus('capabilities', '✅ Notification API: Available', 'pass');
        } else {
            addStatus('capabilities', '❌ Notification API: NOT Available', 'fail');
        }
        
        // Service Worker
        if ('serviceWorker' in navigator) {
            addStatus('capabilities', '✅ Service Worker: Available', 'pass');
        } else {
            addStatus('capabilities', '❌ Service Worker: NOT Available', 'fail');
        }
        
        // Push Manager
        if ('PushManager' in window) {
            addStatus('capabilities', '✅ Push Manager: Available', 'pass');
        } else {
            addStatus('capabilities', '❌ Push Manager: NOT Available', 'fail');
        }
        
        // HTTPS check
        if (location.protocol === 'https:') {
            addStatus('capabilities', '✅ HTTPS: Yes', 'pass');
        } else {
            addStatus('capabilities', '⚠️ HTTPS: No (required for push)', 'warn');
        }
        
        // Vibration API
        if ('vibrate' in navigator) {
            addStatus('capabilities', '✅ Vibration API: Available', 'pass');
        } else {
            addStatus('capabilities', '⚠️ Vibration API: Not available', 'warn');
        }
    }
    
    // Step 2: Check permission
    function checkPermission() {
        if (!('Notification' in window)) {
            addStatus('permission', '❌ Notification API not available', 'fail');
            return;
        }
        
        var perm = Notification.permission;
        log('Current permission: ' + perm);
        
        if (perm === 'granted') {
            addStatus('permission', '✅ Permission: GRANTED', 'pass');
        } else if (perm === 'denied') {
            addStatus('permission', '❌ Permission: DENIED (must reset in browser settings)', 'fail');
        } else {
            addStatus('permission', '⚠️ Permission: ' + perm + ' (need to request)', 'warn');
        }
    }
    
    function requestPermission() {
        log('Requesting permission...');
        
        Notification.requestPermission().then(function(result) {
            log('Permission result: ' + result);
            addStatus('permission', 'Permission result: ' + result, result === 'granted' ? 'pass' : 'fail');
        }).catch(function(err) {
            log('Permission error: ' + err);
            addStatus('permission', 'Error: ' + err, 'fail');
        });
    }
    
    // Step 3: Basic notification test
    function testBasicNotification() {
        log('Testing basic notification...');
        
        if (Notification.permission !== 'granted') {
            addStatus('basicTest', '⚠️ Need permission first!', 'warn');
            return;
        }
        
        try {
            var n = new Notification('Test Notification', {
                body: 'This is a basic notification test at ' + new Date().toLocaleTimeString(),
                icon: '/icon-192.png'
            });
            
            n.onshow = function() {
                log('Notification shown!');
                addStatus('basicTest', '✅ Notification displayed!', 'pass');
            };
            
            n.onerror = function(e) {
                log('Notification error: ' + e);
                addStatus('basicTest', '❌ Notification error', 'fail');
            };
            
            n.onclick = function() {
                log('Notification clicked');
                n.close();
            };
            
            addStatus('basicTest', '📤 Notification sent...', 'info');
            
        } catch(e) {
            log('Exception: ' + e.message);
            addStatus('basicTest', '❌ Exception: ' + e.message, 'fail');
        }
    }
    
    // Step 4: Service Worker test
    function testServiceWorker() {
        log('Testing service worker...');
        
        if (!('serviceWorker' in navigator)) {
            addStatus('swTest', '❌ Service Workers not supported', 'fail');
            return;
        }
        
        // First check if already registered
        navigator.serviceWorker.getRegistrations().then(function(regs) {
            log('Existing registrations: ' + regs.length);
            regs.forEach(function(r) {
                log('  - Scope: ' + r.scope);
            });
        });
        
        // Try to register
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then(function(reg) {
                log('SW registered! Scope: ' + reg.scope);
                addStatus('swTest', '✅ Service Worker registered', 'pass');
                addStatus('swTest', 'Scope: ' + reg.scope, 'info');
                
                // Check state
                var sw = reg.installing || reg.waiting || reg.active;
                if (sw) {
                    addStatus('swTest', 'State: ' + sw.state, 'info');
                }
            })
            .catch(function(err) {
                log('SW registration failed: ' + err);
                addStatus('swTest', '❌ SW Error: ' + err.message, 'fail');
            });
    }
    
    // Step 5: Push Manager test
    function testPushManager() {
        log('Testing Push Manager...');
        
        if (!('PushManager' in window)) {
            addStatus('pushTest', '❌ Push Manager not supported', 'fail');
            return;
        }
        
        navigator.serviceWorker.ready.then(function(reg) {
            log('SW ready, checking push subscription...');
            
            reg.pushManager.getSubscription().then(function(sub) {
                if (sub) {
                    log('Already subscribed!');
                    addStatus('pushTest', '✅ Already subscribed', 'pass');
                    addStatus('pushTest', 'Endpoint: ' + sub.endpoint.substring(0, 50) + '...', 'info');
                } else {
                    log('Not subscribed yet');
                    addStatus('pushTest', '⚠️ Not subscribed yet', 'warn');
                    
                    // Try to subscribe
                    addStatus('pushTest', 'Attempting subscription...', 'info');
                    
                    var vapidKey = 'BCXgZy1ydjIHfjif1l0ktbMRHkY8lBipHu9vaW8ETWOztov7PfljN_dgSXRyihT73SrQo9lV1PRO9a74kCXb3rk';
                    
                    reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(vapidKey)
                    }).then(function(newSub) {
                        log('Subscribed!');
                        addStatus('pushTest', '✅ Push subscription successful!', 'pass');
                    }).catch(function(err) {
                        log('Subscribe error: ' + err);
                        addStatus('pushTest', '❌ Subscribe error: ' + err.message, 'fail');
                    });
                }
            });
        }).catch(function(err) {
            log('SW ready error: ' + err);
            addStatus('pushTest', '❌ Error: ' + err.message, 'fail');
        });
    }
    
    // Helper function
    function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var rawData = window.atob(base64);
        var outputArray = new Uint8Array(rawData.length);
        for (var i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }
    
    // Run on load
    detectDevice();
    checkCapabilities();
    checkPermission();
    </script>
</body>
</html>
